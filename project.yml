# XcodeGen spec — the .xcodeproj is generated, never hand-edited, so it never causes merge conflicts.
# Regenerate with `make project`.
name: NovaShop
options:
  bundleIdPrefix: com.novashop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_COMPILATION_MODE: singlefile
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES

packages:
  NovaKit:
    path: Packages/NovaKit

targets:
  NovaShop:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: NovaKit
        product: AppFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NovaShop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        CFBundleURLTypes:
          - CFBundleURLName: com.novashop.app
            CFBundleURLSchemes: [novashop]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novashop.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  NovaShopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: NovaShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novashop.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NovaShop

schemes:
  NovaShop:
    build:
      targets:
        NovaShop: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: ""
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - NovaShop
      targets:
        - package: NovaKit/DomainTests
        - package: NovaKit/NetworkingTests
        - package: NovaKit/DataTests
        - package: NovaKit/ImagePipelineTests
        - package: NovaKit/RoutingTests
        - package: NovaKit/FeatureTests
        - name: NovaShopUITests
    profile:
      config: Release
    archive:
      config: Release
